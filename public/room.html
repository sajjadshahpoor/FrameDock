<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Meeting - FrameDock</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="room">
  <div id="call-screen" class="call">
    <header class="call-header">
      <a class="brand" href="/" title="FrameDock home">
        <img src="/img/logo.svg" alt="" width="24" height="24">
      </a>
      <span id="room-code" class="room-code"></span>
      <span id="audio-only-badge" class="badge" hidden>Audio only</span>
      <span id="participant-count" class="participant-count"></span>
    </header>

    <main class="stage">
      <div id="video-grid" class="video-grid" aria-live="polite"></div>
    </main>

    <footer class="control-bar">
      <div class="controls">
        <button id="toggle-mic" class="ctrl" type="button" aria-pressed="true" title="Turn off microphone">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11h-2c0 .74-.16 1.43-.43 2.05l1.23 1.23A6.9 6.9 0 0 0 19 11zm-4.02.17L9 5.18V5a3 3 0 0 1 6 0v6c0 .06-.01.11-.02.17zM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.52 2.58l1.66 1.66A4.98 4.98 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 3.54-1.4L19.73 21 21 19.73 4.27 3z"/></svg>
          <span class="sr-only">Microphone</span>
        </button>
        <button id="toggle-cam" class="ctrl" type="button" aria-pressed="true" title="Turn off camera">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.82L21 17.18V6.5zM3.27 2 2 3.27 4.73 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.21 0 .39-.08.55-.18L19.73 21 21 19.73 3.27 2z"/></svg>
          <span class="sr-only">Camera</span>
        </button>
        <button id="toggle-audio-only" class="ctrl" type="button" aria-pressed="false" title="Switch to audio-only mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5v-1a7 7 0 0 1 14 0v1h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg>
          <span class="sr-only">Audio-only mode</span>
        </button>
        <button id="leave-call" class="ctrl ctrl-danger" type="button" title="Leave call">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41-.01L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.01 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg>
          <span class="sr-only">Leave</span>
        </button>
      </div>
    </footer>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <template id="tile-template">
    <div class="tile video-off">
      <video autoplay playsinline></video>
      <div class="avatar"><span class="avatar-initials"></span></div>
      <div class="tile-label">
        <svg class="tile-muted" viewBox="0 0 24 24" aria-label="Muted"><path d="M19 11h-2c0 .74-.16 1.43-.43 2.05l1.23 1.23A6.9 6.9 0 0 0 19 11zm-4.02.17L9 5.18V5a3 3 0 0 1 6 0v6c0 .06-.01.11-.02.17zM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.52 2.58l1.66 1.66A4.98 4.98 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 3.54-1.4L19.73 21 21 19.73 4.27 3z"/></svg>
        <span class="tile-name"></span>
      </div>
    </div>
  </template>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room-code.js"></script>
  <script src="/js/signaling.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/peers.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
